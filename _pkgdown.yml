url: https://jorgeklz.github.io/momst/

template:
  bootstrap: 5
  bslib:
    bg: "#f7f8f5"
    fg: "#17220f"
    primary: "#1e6b14"
    secondary: "#55604a"
    success: "#2e8a1f"
    warning: "#d4a80a"
    danger: "#b3261e"
    border-radius: 8px
    font-size-base: 0.9375rem
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

navbar:
  bg: light
  structure:
    left: [intro, reference, articles, app, news]
  components:
    app:
      text: Web app
      icon: fa-play
      href: https://jorgeklz.github.io/momst/app/

reference:
  - title: "Package overview"
    desc: "Welcome page and pointers to the rest of the documentation."
    contents:
      - momst-package

  - title: "Main solver"
    desc: "Single entry point to run the NSGA-II based MO-MST solver."
    contents:
      - run_momst

  - title: "Interactive app"
    desc: "Shiny explorer for the solver, also available online at <https://jorgeklz.github.io/momst/app/>."
    contents:
      - run_app

  - title: "Instance and lookup"
    desc: "Generate random complete-graph instances and pre-compute edge-weight lookup tables."
    contents:
      - generate_instance
      - build_weight_lookup

  - title: "Prufer encoding"
    desc: "Tree encoding helpers used internally by the genetic operators."
    contents:
      - decode_prufer
      - generate_prufer_population

  - title: "NSGA-II operators"
    desc: "Objective evaluation, ranking, and the standard NSGA-II operators."
    contents:
      - compute_objectives
      - non_dominated_crowding
      - tournament_selection
      - uniform_crossover
      - random_mutation

  - title: "Local search operators"
    desc: "Three local search strategies and the dispatcher used by run_momst()."
    contents:
      - apply_local_search
      - path_relinking
      - pareto_local_search
      - tabu_search

  - title: "Plotting"
    desc: "Convenience plots for the Pareto front and the best compromise tree."
    contents:
      - plot_pareto_front
      - plot_best_tree

articles:
  - title: "Vignettes"
    navbar: ~
    contents:
      - getting-started
      - momst-variants

footer:
  structure:
    left: author
    right: doi
  components:
    author: "Jorge Parraga-Alava, Ph.D"
    doi: "[doi:10.1109/CEC.2017.7969432](https://doi.org/10.1109/CEC.2017.7969432)"

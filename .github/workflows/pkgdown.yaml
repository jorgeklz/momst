# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Builds and deploys the pkgdown documentation site to GitHub Pages.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::shinylive, any::shiny, any::bslib, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Static, serverless build of inst/app with shinylive (R runs in the
      # browser through webR). momst is not on the webR repository, so the
      # package sources are bundled next to app.R and sourced at start-up.
      - name: Build web app
        run: |
          mkdir -p app_src/momst_src
          cp -r inst/app/. app_src/
          # plot.R (igraph), run_app.R and the package doc are not needed in the
          # browser; leaving them out keeps igraph out of the webR bundle.
          for f in R/*.R; do
            case "$(basename "$f")" in
              plot.R|run_app.R|momst-package.R) ;;
              *) cp "$f" app_src/momst_src/ ;;
            esac
          done
          Rscript -e 'shinylive::export("app_src", "docs/app")'

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
